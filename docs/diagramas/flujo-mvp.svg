middle" dominant-baseline="central" fill="#26215C">elige talla y color</text><text x="566" y="170" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#534AB7">ZTV-13 · ZTV-15</text><polygon points="734,110 796,155 734,200 672,155" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/><text x="734" y="155" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#412402">¿Disponible?</text><rect x="831" y="120" width="142" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="902" y="147.5" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#26215C">Agrega al carrito</text><text x="902" y="162.5" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#534AB7">ZTV-16</text><rect x="999" y="120" width="142" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="1070" y="140" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#26215C">Revisa y ajusta</text><text x="1070" y="155" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#26215C">el carrito</text><text x="1070" y="170" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#534AB7">ZTV-17 · ZTV-18</text><rect x="1167" y="120" width="142" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="1238" y="140" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#26215C">Ingresa datos de</text><text x="1238" y="155" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#26215C">contacto y envío</text><text x="1238" y="170" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#534AB7">ZTV-19</text><rect x="1335" y="303" width="142" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="1406" y="322.5" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#04342C">Revalida precio y stock;</text><text x="1406" y="337.5" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#04342C">crea pedido</text><text x="1406" y="352.5" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#04342C">«Pendiente de pago»</text><text x="1406" y="367.5" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">ZTV-20</text><polygon points="1574,300 1636,345 1574,390 1512,345" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/><text x="1574" y="337.5" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#412402">¿Cambió</text><text x="1574" y="352.5" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#412402">algo?</text><rect x="1671" y="510" width="142" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="1742" y="530" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">El cliente paga:</text><text x="1742" y="545" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">tarjeta, PSE o Nequi</text><text x="1742" y="560" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Sandbox</text><rect x="1839" y="510" width="142" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="1910" y="530" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Avisa el resultado</text><text x="1910" y="545" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">(evento firmado)</text><text x="1910" y="560" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Webhook</text><polygon points="2078,293 2153,345 2078,397 2003,345" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/><text x="2078" y="330" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#412402">¿Firma 